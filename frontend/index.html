<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>To-Do Приложение</h1>

    <div id="auth-section">
        <h2>Авторизация</h2>
        <input type="text" id="login-username" placeholder="Введите логин">
        <input type="password" id="login-password" placeholder="Введите пароль">
        <button onclick="login()">Войти</button>
        <p id="auth-message"></p>

        <h2>Регистрация</h2>
        <input type="text" id="register-username" placeholder="Введите логин">
        <input type="password" id="register-password" placeholder="Введите пароль">
        <button onclick="register()">Зарегистрироваться</button>
        <p id="register-message"></p>
    </div>

    <div id="tasks-section" style="display: none;">
        <h2>Список задач</h2>
        <button onclick="logout()">Выйти</button>
        <ul id="task-list"></ul>

        <h3>Создать новую задачу</h3>
        <input type="text" id="task-title" placeholder="Название задачи">
        <input type="text" id="task-desc" placeholder="Описание">
        <input type="datetime-local" id="task-deadline">
        <button onclick="createTask()">Создать</button>
        <p id="task-message"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
