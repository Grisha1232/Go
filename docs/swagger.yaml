openapi: 3.0.0
info:
  title: ToDo API
  version: 1.0.0
paths:
  /tasks:
    get:
      summary: Получить список задач
      responses:
        "200":
          description: Успешный ответ
    post:
      summary: Создать задачу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                deadline:
                  type: string
                  format: date
