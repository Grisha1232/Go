name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v3

      - name: Установка Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.24

      - name: Установка зависимостей
        run: go mod tidy

      - name: Запуск тестов
        run: go test ./...

      - name: Логин в DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
      
      - name: Сборка Docker-образа
        run: docker build -t gregua1232/todo-app:latest .

      - name: Пуш Docker-образа в DockerHub
        run: docker push gregua1232/todo-app:latest
