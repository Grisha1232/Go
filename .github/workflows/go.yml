name: Go CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v3

      - name: Установка Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.18

      - name: Установка зависимостей
        run: go mod tidy

      - name: Запуск тестов
        run: go test ./...

      - name: Сборка Docker-образа
        run: docker build -t your-dockerhub/todo-app .

      - name: Деплой в DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push your-dockerhub/todo-app
